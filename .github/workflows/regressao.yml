name: Pipeline de Qualidade

on:
  push:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  DATABASE_URL_AUTH: postgresql://postgres:postgrespassword@localhost:5432/postgres?schema=auth
  DATABASE_URL_DEMAND: postgresql://postgres:postgrespassword@localhost:5432/postgres?schema=demand
  REDIS_URL: redis://:redis-dev@localhost:6379
  JWT_SECRET: ci-secret-resolve-app

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout resolve-app
        uses: actions/checkout@v4
        with:
          path: resolve-app

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Testes unitários — mobile
        id: unitarios_mobile
        continue-on-error: true
        working-directory: resolve-app
        run: |
          mkdir -p relatorios/mobile
          node --experimental-strip-types --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=relatorios/mobile/unit-mobile.xml \
            frontend/mobile/utils/__tests__/extractBairro.test.mjs \
            frontend/mobile/utils/__tests__/senha.test.mjs \
            frontend/mobile/utils/__tests__/mfa.test.mjs

      - name: Instalar dependências — demand-service
        working-directory: resolve-app/backend/demand-service
        run: npm ci

      - name: Testes unitários — demand-service
        id: unitarios_backend
        continue-on-error: true
        working-directory: resolve-app/backend/demand-service
        run: |
          mkdir -p relatorios
          npm run test:unit -- --coverage --reporter=default --reporter=junit --outputFile.junit=relatorios/unit-demand.xml

      - name: Subir PostgreSQL e Redis
        working-directory: resolve-app/backend
        run: docker compose up -d postgres redis

      - name: Aguardar PostgreSQL e Redis ficarem prontos
        run: |
          timeout 60 bash -c 'until docker exec smartcity_postgres pg_isready -U postgres; do sleep 2; done'
          timeout 30 bash -c 'until docker exec smartcity_redis redis-cli -a redis-dev --no-auth-warning ping | grep -q PONG; do sleep 2; done'

      - name: Instalar dependências — auth-service
        working-directory: resolve-app/backend/auth-service
        run: npm ci

      - name: Gerar Prisma Client — auth-service
        working-directory: resolve-app/backend/auth-service
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_AUTH }}

      - name: Criar tabelas — auth-service
        working-directory: resolve-app/backend/auth-service
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_AUTH }}

      - name: Gerar Prisma Client — demand-service
        working-directory: resolve-app/backend/demand-service
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_DEMAND }}

      - name: Criar tabelas — demand-service
        working-directory: resolve-app/backend/demand-service
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_DEMAND }}

      - name: Criar tabela auxiliar demand.usuarios
        run: |
          docker exec smartcity_postgres psql -U postgres -d postgres -c "
            CREATE TABLE IF NOT EXISTS demand.usuarios (
              id SERIAL PRIMARY KEY,
              nome VARCHAR(100) NOT NULL,
              email VARCHAR(35) NOT NULL,
              senha VARCHAR(60) NOT NULL,
              papel VARCHAR(20) NOT NULL,
              CONSTRAINT usuarios_demand_email_key UNIQUE (email)
            );
          "

      - name: Testes de API — auth-service
        id: api_auth
        continue-on-error: true
        working-directory: resolve-app/backend/auth-service
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_AUTH }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          PORT: 3001
        run: |
          mkdir -p relatorios
          npx vitest run --reporter=default --reporter=junit --outputFile.junit=relatorios/api-auth.xml

      - name: Testes de API — demand-service
        id: api_demand
        continue-on-error: true
        working-directory: resolve-app/backend/demand-service
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_DEMAND }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: change-me
          PORT: 3002
        run: |
          mkdir -p relatorios
          npm run test:api -- --reporter=default --reporter=junit --outputFile.junit=relatorios/api-demand.xml

      - name: Liberar PostgreSQL e Redis para a stack E2E
        if: github.event_name != 'push'
        working-directory: resolve-app/backend
        run: docker compose down -v

      # O E2E valida o backend e o frontend DESTE repositório (mesmo commit dos testes).
      # O override docker-compose.e2e.yml acrescenta um receptor que imita o Expo Push (só para testes).
      - name: Subir backend para E2E
        if: github.event_name != 'push'
        working-directory: resolve-app/backend
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: Aguardar api-gateway e serviços (:8080)
        if: github.event_name != 'push'
        run: |
          timeout 240 bash -c 'until nc -z localhost 8080; do sleep 3; done'
          # Gateway no ar não garante serviços prontos (cada um roda prisma db push ao iniciar).
          # auth responde 400 a login vazio; demand responde 401 sem token.
          timeout 240 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/auth/login -H "Content-Type: application/json" -d "{}")" = "400" ]; do sleep 3; done'
          timeout 240 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/demands/gestor)" = "401" ]; do sleep 3; done'
          # Receptor que imita o Expo Push (usado pelo teste de notificação do cenário 9).
          timeout 60 bash -c 'until curl -fs http://127.0.0.1:4010/health >/dev/null; do sleep 2; done'

      - name: Instalar dependências — frontend
        if: github.event_name != 'push'
        working-directory: resolve-app/frontend
        run: npm ci

      - name: Build frontend
        if: github.event_name != 'push'
        working-directory: resolve-app/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080

      - name: Iniciar frontend em segundo plano
        if: github.event_name != 'push'
        working-directory: resolve-app/frontend
        run: |
          NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:8080 npm run start > ../frontend-e2e.log 2>&1 &
          timeout 60 bash -c 'until nc -z localhost 3000; do sleep 2; done'

      - name: Instalar dependências — E2E
        if: github.event_name != 'push'
        working-directory: resolve-app/e2e
        run: npm ci

      - name: Instalar Chromium (Playwright)
        if: github.event_name != 'push'
        working-directory: resolve-app/e2e
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E — pull request
        id: smoke_e2e
        continue-on-error: true
        if: github.event_name == 'pull_request'
        working-directory: resolve-app/e2e
        run: |
          npx playwright test \
            tests/01-cadastros-sucesso.spec.ts \
            tests/02-validacao-campos-obrigatorios-nova-demanda.spec.ts
        env:
          E2E_API_URL: http://localhost:8080
          E2E_REUSE_SERVER: 'true'
          E2E_JUNIT_FILE: test-results/smoke-e2e.xml
          CI: true

      - name: Regressão E2E completa — agendamento diário ou execução manual
        id: regressao_e2e
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: resolve-app/e2e
        run: npx playwright test
        env:
          E2E_API_URL: http://localhost:8080
          E2E_REUSE_SERVER: 'true'
          E2E_JUNIT_FILE: test-results/regressao-e2e.xml
          E2E_EXPO_MOCK_URL: http://127.0.0.1:4010
          CI: true

      # Entregável 6 (item 6.6): verificação de vulnerabilidades conhecidas nas dependências.
      # Reprova o Quality Gate se houver vulnerabilidade alta ou crítica em dependências de produção.
      - name: Auditoria de dependências (npm audit)
        id: npm_audit
        if: always()
        continue-on-error: true  # o gate é reprovado no passo final, para os demais relatórios serem gerados
        working-directory: resolve-app
        run: |
          status=0
          {
            echo "## Auditoria de dependências (npm audit, nível alto ou crítico)"
            echo "| Projeto | Resultado |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in backend/auth-service backend/demand-service backend/api-gateway backend/metrics-service frontend e2e; do
            if (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 && npm audit --omit=dev --audit-level=high); then
              echo "| $dir | sem vulnerabilidades altas ou críticas |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $dir | vulnerabilidades encontradas, ver log do passo |" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          # Aplicativo mobile: informativo, não reprova o gate. As vulnerabilidades altas restantes
          # (expo-router -> query-string -> decode-uri-component) só se resolvem com a troca do
          # Expo SDK, que o Dependabot propõe em grupo (dependabot.yml). Voltar a ser bloqueante
          # depois dessa atualização.
          if (cd frontend/mobile && npm ci --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 && npm audit --omit=dev --audit-level=high); then
            echo "| frontend/mobile | sem vulnerabilidades altas ou críticas |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| frontend/mobile | vulnerabilidades encontradas (informativo, aguarda atualização do Expo SDK), ver log do passo |" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::npm audit encontrou vulnerabilidades altas ou críticas no frontend/mobile (informativo)."
          fi
          exit $status

      - name: Resumo das suites
        if: always()
        run: |
          {
            echo "## Resultados dos testes automatizados"
            echo "| Suite | Resultado |"
            echo "|---|---|"
            echo "| Unitários — demand-service | ${{ steps.unitarios_backend.outcome }} |"
            echo "| Unitários — mobile | ${{ steps.unitarios_mobile.outcome }} |"
            echo "| API — auth-service | ${{ steps.api_auth.outcome }} |"
            echo "| API — demand-service | ${{ steps.api_demand.outcome }} |"
            echo "| Smoke E2E — pull request | ${{ steps.smoke_e2e.outcome }} |"
            echo "| Regressão E2E completa | ${{ steps.regressao_e2e.outcome }} |"
            echo "| Auditoria de dependências (npm audit) | ${{ steps.npm_audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gerar métricas e relatórios de qualidade
        if: always()
        working-directory: resolve-app
        env:
          MOBILE_UNIT_OUTCOME: ${{ steps.unitarios_mobile.outcome }}
          DEMAND_UNIT_OUTCOME: ${{ steps.unitarios_backend.outcome }}
          AUTH_API_OUTCOME: ${{ steps.api_auth.outcome }}
          DEMAND_API_OUTCOME: ${{ steps.api_demand.outcome }}
          E2E_SMOKE_OUTCOME: ${{ steps.smoke_e2e.outcome }}
          E2E_FULL_OUTCOME: ${{ steps.regressao_e2e.outcome }}
        run: |
          python3 .github/scripts/generate_quality_reports.py

      - name: Abrir issue para falhas reais de testes
        if: >-
          always() &&
          (steps.unitarios_mobile.outcome == 'failure' ||
          steps.unitarios_backend.outcome == 'failure' ||
          steps.api_auth.outcome == 'failure' ||
          steps.api_demand.outcome == 'failure' ||
          steps.smoke_e2e.outcome == 'failure' ||
          steps.regressao_e2e.outcome == 'failure')
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const metrics = JSON.parse(fs.readFileSync('resolve-app/quality-reports/metrics.json', 'utf8'));
            const outcomes = {
              'Unitários mobile': '${{ steps.unitarios_mobile.outcome }}',
              'Unitários demand-service': '${{ steps.unitarios_backend.outcome }}',
              'API auth-service': '${{ steps.api_auth.outcome }}',
              'API demand-service': '${{ steps.api_demand.outcome }}',
              'Smoke E2E': '${{ steps.smoke_e2e.outcome }}',
              'Regressão E2E': '${{ steps.regressao_e2e.outcome }}',
            };
            const failed = Object.entries(outcomes).filter(([, outcome]) => outcome === 'failure');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const suiteRows = failed.map(([name]) => {
              const suite = metrics.suites.find((item) => item.name === name);
              if (suite?.runner_error) {
                return `| ${name} | indisponível | indisponível | indisponível |`;
              }
              return suite
                ? `| ${name} | ${suite.passed} | ${suite.failed} | ${suite.skipped} |`
                : `| ${name} | indisponível | indisponível | indisponível |`;
            }).join('\n');
            const failedCases = failed.flatMap(([name]) => {
              const suite = metrics.suites.find((item) => item.name === name);
              return (suite?.test_cases ?? [])
                .filter((testCase) => testCase.status === 'failed')
                .map((testCase) => `- **${name} / ${testCase.name}:** ${testCase.detail || 'falha sem mensagem no JUnit'}`);
            });
            const body = [
              'Uma ou mais suites de testes falharam no pipeline de qualidade.',
              '',
              `- Execução: [${context.runId}](${runUrl})`,
              `- Branch: \`${context.ref.replace('refs/heads/', '')}\``,
              `- Commit: \`${context.sha}\``,
              '',
              '| Suite | Passed | Failed | Skipped |',
              '|---|---:|---:|---:|',
              suiteRows,
              ...(failedCases.length ? ['', 'Casos com falha:', ...failedCases] : []),
              '',
              'Consulte os relatórios técnicos e artefatos na execução do workflow. O Quality Gate permanece reprovado para esta execução.',
              '',
              '### Triagem (Política de Manutenção da TAS, ver docs/tas.md)',
              'Classifique esta falha em até 3 dias úteis (P1: 1 dia útil). Não use test.fail, test.fixme ou test.skip apenas para deixar o pipeline verde.',
              '',
              '- [ ] **Classe:** SUT | TAS | Ambiente | Variação esperada',
              '- [ ] **Prioridade:** P1 | P2 | P3',
              '- [ ] **Responsável:** usuário do GitHub designado nesta issue',
              '- [ ] **Prazo:** AAAA-MM-DD',
              '- [ ] **Evidência:** link desta execução e do artefato `evidencias-testes-<id>`',
              '- [ ] **Decisão/encaminhamento:** correção, quarentena (com issue e prazo) ou aceite como variação esperada',
              '',
              'Se a causa for diferente da de outras falhas já registradas nesta issue, abra uma issue separada com o modelo "Falha ou manutenção da TAS".',
            ].join('\n');
            const label = 'ci-failure';
            const title = `[CI] Falha em testes (${context.sha.slice(0, 7)})`;
            const rotulos = [
              [label, 'b60205', 'Falha automática detectada pelo pipeline de qualidade'],
              ['needs-triage', 'fbca04', 'Aguardando classificação conforme docs/tas.md'],
            ];
            for (const [name, color, description] of rotulos) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              } catch (error) {
                // rótulo já existe
              }
            }
            // Evita duplicatas: se já há issue aberta de falha de CI, comenta nela.
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number,
                body: 'Nova falha em `' + context.sha.slice(0, 7) + '`.\n\n' + body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label, 'needs-triage'] });
            }

      - name: Coletar logs da stack E2E
        if: always() && github.event_name != 'push'
        continue-on-error: true
        working-directory: resolve-app/backend
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > ../stack-e2e.log 2>&1

      - name: Publicar relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-testes-${{ github.run_id }}
          path: |
            resolve-app/backend/demand-service/relatorios/
            resolve-app/backend/auth-service/relatorios/
            resolve-app/backend/demand-service/coverage-unit/
            resolve-app/relatorios/mobile/
            resolve-app/e2e/playwright-report/
            resolve-app/e2e/test-results/
            resolve-app/quality-reports/
            resolve-app/stack-e2e.log
            resolve-app/frontend-e2e.log
          retention-days: 14
          if-no-files-found: warn

      - name: Reprovar o Quality Gate se alguma suite falhou
        if: always()
        env:
          BACKEND_UNIT: ${{ steps.unitarios_backend.outcome }}
          MOBILE_UNIT: ${{ steps.unitarios_mobile.outcome }}
          API_AUTH: ${{ steps.api_auth.outcome }}
          API_DEMAND: ${{ steps.api_demand.outcome }}
          E2E_SMOKE: ${{ steps.smoke_e2e.outcome }}
          E2E_FULL: ${{ steps.regressao_e2e.outcome }}
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
        run: |
          failed=0
          for result in "$BACKEND_UNIT" "$MOBILE_UNIT" "$API_AUTH" "$API_DEMAND" "$E2E_SMOKE" "$E2E_FULL" "$NPM_AUDIT"; do
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Uma ou mais suites automatizadas falharam."
            exit 1
          fi
