services:

  redis:
    image: redis:7-alpine
    container_name: smartcity_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: smartcity_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    container_name: smartcity_auth
    restart: always
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/postgres?schema=public"
      #DATABASE_URL_AUTH: "postgresql://postgres:postgrespassword@postgres:5432/postgres?schema=public"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  demand-service:
    build: ./demand-service
    container_name: smartcity_demand
    restart: always
    environment:
      PORT: 3002
      REDIS_URL: redis://redis:6379
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/postgres?schema=public"
      #DATABASE_URL_AUTH: "postgresql://postgres:postgrespassword@postgres:5432/postgres?schema=public"
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  metrics-service:
    build: ./metrics-service
    container_name: smartcity_metrics
    restart: always
    environment:
      PORT: 3003
      REDIS_URL: redis://redis:6379
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/postgres?schema=public"
      #DATABASE_URL_AUTH: "postgresql://postgres:postgrespassword@postgres:5432/postgres?schema=public"
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: smartcity_gateway
    restart: always
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:3001
      DEMAND_SERVICE_URL: http://demand-service:3002
      METRICS_SERVICE_URL: http://metrics-service:3003
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - demand-service
      - metrics-service

volumes:
  postgres_data: