services:

  redis:
    image: redis:7-alpine
    container_name: smartcity_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis-dev}
    # Publicado só na máquina local, para depuração.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis-dev} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: smartcity_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Em desenvolvimento os serviços usam o usuário administrador do banco.
  # Os usuários por serviço (menor privilégio) são configurados em docker-compose.prod.yml.
  auth-service:
    build: ./auth-service
    container_name: smartcity_auth
    restart: always
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/postgres?schema=public"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-segredo-somente-desenvolvimento}
      DEMAND_SERVICE_URL: http://demand-service:3002
      GESTOR_ACCESS_CODE: ${GESTOR_ACCESS_CODE:-change-me-codigo-gestor}
      GESTOR_ACCESS_CODES: ${GESTOR_ACCESS_CODES:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_OBRIGATORIO_GESTOR: ${MFA_OBRIGATORIO_GESTOR:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  demand-service:
    build: ./demand-service
    container_name: smartcity_demand
    restart: always
    environment:
      PORT: 3002
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev}@redis:6379
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/postgres?schema=public"
      JWT_SECRET: ${JWT_SECRET:-segredo-somente-desenvolvimento}
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  metrics-service:
    build: ./metrics-service
    container_name: smartcity_metrics
    restart: always
    environment:
      PORT: 3003
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev}@redis:6379
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/postgres?schema=public"
      JWT_SECRET: ${JWT_SECRET:-segredo-somente-desenvolvimento}
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: smartcity_gateway
    restart: always
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:3001
      DEMAND_SERVICE_URL: http://demand-service:3002
      METRICS_SERVICE_URL: http://metrics-service:3003
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - demand-service
      - metrics-service

volumes:
  postgres_data:
