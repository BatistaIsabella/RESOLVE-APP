databases:
  - name: smartcity-auth-db
    plan: free
    databaseName: db_auth

  - name: smartcity-demand-db
    plan: free
    databaseName: db_demand

envVarGroups:
  - name: smartcity-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  - type: redis
    name: smartcity-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: smartcity-auth
    runtime: docker
    dockerfilePath: ./backend/auth-service/Dockerfile
    dockerContext: ./backend/auth-service
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL_AUTH
        fromDatabase:
          name: smartcity-auth-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: smartcity-redis
          type: redis
          property: connectionString
      - key: DEMAND_SERVICE_URL
        fromService:
          name: smartcity-demand
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Defina no painel do Render. Sem esta variável o cadastro de gestor fica fechado.
      - key: GESTOR_ACCESS_CODES
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: DADOS_ENCRYPTION_KEY
        sync: false
      - key: CONFIRMACAO_EMAIL_HABILITADA
        value: "false"
      - key: EMAIL_HASH_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - fromGroup: smartcity-shared
      - key: PORT
        value: 3001

  - type: web
    name: smartcity-demand
    runtime: docker
    dockerfilePath: ./backend/demand-service/Dockerfile
    dockerContext: ./backend/demand-service
    plan: free
    envVars:
      - key: DATABASE_URL_DEMAND
        fromDatabase:
          name: smartcity-demand-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: smartcity-redis
          type: redis
          property: connectionString
      # Tem de ser igual à do auth-service: cifra o e-mail do solicitante. Sem ela o serviço não sobe em produção.
      - key: DADOS_ENCRYPTION_KEY
        sync: false
      - fromGroup: smartcity-shared
      - key: PORT
        value: 3002

  - type: web
    name: smartcity-metrics
    runtime: docker
    dockerfilePath: ./backend/metrics-service/Dockerfile
    dockerContext: ./backend/metrics-service
    plan: free
    envVars:
      - key: DATABASE_URL_DEMAND
        fromDatabase:
          name: smartcity-demand-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: smartcity-redis
          type: redis
          property: connectionString
      - fromGroup: smartcity-shared
      - key: PORT
        value: 3003

  - type: web
    name: smartcity-gateway
    runtime: docker
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: ./backend/api-gateway
    plan: free
    envVars:
      - key: AUTH_SERVICE_URL
        fromService:
          name: smartcity-auth
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEMAND_SERVICE_URL
        fromService:
          name: smartcity-demand
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: METRICS_SERVICE_URL
        fromService:
          name: smartcity-metrics
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: 8080
